<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
  const bootstrap = window.TB_BOOTSTRAP || {};
  const params = new URLSearchParams(window.location.search);
  const lang = params.get("lang") || params.get("language") || "de";
  const postHeight = () => { try { window.parent.postMessage({ type: "tarifbutler:height", height: document.documentElement.scrollHeight }, "*"); } catch (_) {} };
  new ResizeObserver(postHeight).observe(document.body);
  window.addEventListener("load", postHeight);

  function applyDesign(data) {
    const brand = data?.design_config?.brand || {};
    const survey = data?.design_config?.survey || {};
    const legacy = data?.setting_survey_design || {};
    const root = document.documentElement;
    root.style.setProperty("--primary-color", survey.primary_color || brand.primary_color || legacy.primary_color || "#00ff9d");
    root.style.setProperty("--bg-card", survey.bg_card || legacy.bg_card || "#ffffff");
    root.style.setProperty("--text-color", survey.text_color || brand.text_color || legacy.text_color || "#334155");
    root.style.setProperty("--border-radius", survey.border_radius || legacy.border_radius || "2.5rem");
    root.style.setProperty("--btn-bg", survey.start_button?.bg_color || legacy.start_button?.bg_color || "#0f172a");
    root.style.setProperty("--btn-text", survey.start_button?.text_color || legacy.start_button?.text_color || "#00ff9d");
    root.style.setProperty("--back-bg", survey.back_button?.bg_color || legacy.back_button?.bg_color || "transparent");
    root.style.setProperty("--back-text", survey.back_button?.text_color || legacy.back_button?.text_color || "#94a3b8");
  }

  function buildConfig(data) {
    const runtime = data?.runtime_config || {};
    const urls = data?.url_config || {};
    return {
      ...bootstrap,
      lang,
      language: lang,
      locationId: bootstrap.locationId,
      avatarUrl: urls.avatarUrl || urls.avatar_url || bootstrap.avatarUrl,
      offerUrl: urls.offerUrl || urls.offer_url || bootstrap.offerUrl,
      auftragUrl: urls.auftragUrl || urls.auftrag_url || bootstrap.auftragUrl,
      startUrl: urls.startUrl || urls.start_url || bootstrap.startUrl,
      settingProxyPath: runtime.settingProxyPath || runtime.setting_proxy_path || bootstrap.settingProxyPath,
      closingProxyPath: runtime.closingProxyPath || runtime.closing_proxy_path || bootstrap.closingProxyPath,
      settingEngineUrl: runtime.settingEngineUrl || runtime.setting_engine_url || bootstrap.settingEngineUrl,
      closingEngineUrl: runtime.closingEngineUrl || runtime.closing_engine_url || bootstrap.closingEngineUrl,
      engineUrl: runtime.engineUrl || runtime.settingEngineUrl || runtime.setting_engine_url || bootstrap.settingEngineUrl
    };
  }

  try {
    const client = supabase.createClient(bootstrap.supabaseUrl, bootstrap.supabaseKey);
    const { data, error } = await client.from("kunden_config").select("*").eq("location_id", bootstrap.locationId).single();
    if (error) throw error;
    window.KUNDEN_DATA = data;
    applyDesign(data);
    window.SURVEY_CONFIG = buildConfig(data);
    const response = await fetch(`${window.SURVEY_CONFIG.engineUrl}?v=${Date.now()}`);
    if (!response.ok) throw new Error(`Engine konnte nicht geladen werden: ${response.status}`);
    const script = document.createElement("script");
    script.text = await response.text();
    document.body.appendChild(script);
    postHeight();
  } catch (error) {
    console.error("Setting loader error:", error);
    document.getElementById("survey-app").innerHTML = '<div class="tb-loader-error">Fehler beim Laden.</div>';
    postHeight();
  }
})();
</script>
