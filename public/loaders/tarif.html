<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TarifButler Angebot</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:transparent;font-family:Poppins,system-ui,sans-serif;color:#0f172a}.card{max-width:760px;margin:24px auto;padding:32px;border-radius:28px;background:#fff;box-shadow:0 24px 80px #0f172a14}.btn{display:inline-block;margin-top:20px;padding:14px 24px;border-radius:999px;background:#0f172a;color:#00ff9d;font-weight:800;text-decoration:none;border:0;cursor:pointer}.muted{color:#64748b}.grid{display:grid;gap:12px;margin-top:20px}.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #e2e8f0}</style></head><body><div id="offer-app" class="card"><h1>Ihr persönliches Tarifangebot</h1><p class="muted">Wir laden Ihre Anfrage…</p></div><script>
const BOOTSTRAP={locationId:"zMzYbmm0fF0pPpuzSBL7",supabaseUrl:"https://oynhnhkldvpoqhsfirwf.supabase.co",supabaseKey:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95bmhuaGtsZHZwb3Foc2ZpcndmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTAwODksImV4cCI6MjA3NTA2NjA4OX0.9zYOwel585SOUAtVc4XkWhhJl4qldwX6oOhOH7L-eJ4"};const params=new URLSearchParams(location.search);const uuid=params.get('uuid');const lang=params.get('lang')||'de';const app=document.getElementById('offer-app');const resize=()=>parent.postMessage({type:'tarifbutler:height',height:document.documentElement.scrollHeight},'*');new ResizeObserver(resize).observe(document.body);addEventListener('load',resize);function nav(path){const url=new URL(path,location.origin).toString();try{parent.postMessage({type:'tarifbutler:navigate',url},'*')}catch{} if(parent===window)location.assign(url)}
async function loadOrder(sb){const tables=['auftraege','orders','kunden_anfragen','setting_survey_orders'];for(const table of tables){try{const res=await sb.from(table).select('*').eq('uuid',uuid).maybeSingle();if(res.data)return res.data}catch(e){}}return null}
(async()=>{try{if(!uuid)throw new Error('missing uuid');window.TARIFBUTLER_CONFIG={...BOOTSTRAP,uuid,lang};const sb=supabase.createClient(BOOTSTRAP.supabaseUrl,BOOTSTRAP.supabaseKey);const order=await loadOrder(sb);window.AUFTRAG_DATA=order;app.innerHTML=`<h1>Ihr Tarifangebot ist bereit</h1><p class="muted">Auftragsnummer: <strong>${uuid}</strong></p><div class="grid"><div class="row"><span>Status</span><strong>${order?'geladen':'bereit zur Fortsetzung'}</strong></div><div class="row"><span>Sprache</span><strong>${lang.toUpperCase()}</strong></div></div><button class="btn" id="cta">Jetzt wechseln</button>`;document.getElementById('cta').onclick=()=>nav('/auftrag?uuid='+encodeURIComponent(uuid)+'&lang='+encodeURIComponent(lang));resize()}catch(e){console.error(e);nav('/fehler')}})();
</script></body></html>
