<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TarifButler Angebot</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
    :root{--primary-color:#00ff9d;--bg-card:#ffffff;--text-color:#0f172a;--border-radius:2rem;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;background:transparent;font-family:Poppins,system-ui,sans-serif;color:var(--text-color)}
    #tarif-app{width:100%;min-height:640px}.loader-state{max-width:760px;margin:32px auto;padding:32px;border-radius:var(--border-radius);background:var(--bg-card);box-shadow:0 24px 80px #0f172a14;text-align:center}.loader-state p{color:var(--muted)}.loader-error{color:#ef4444;font-weight:800}
  </style>
</head>
<body>
  <div id="tarif-app"><div class="loader-state"><h1>Ihr Tarifangebot wird geladen…</h1><p>Bitte einen Moment Geduld.</p></div></div>
  <script>
    const BOOTSTRAP_CONFIG = {
      locationId: "zMzYbmm0fF0pPpuzSBL7",
      avatarUrl: "https://oynhnhkldvpoqhsfirwf.supabase.co/storage/v1/object/public/TarifButler%20Specifics/setting-survey-avatar.png",
      supabaseUrl: "https://oynhnhkldvpoqhsfirwf.supabase.co",
      supabaseKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95bmhuaGtsZHZwb3Foc2ZpcndmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTAwODksImV4cCI6MjA3NTA2NjA4OX0.9zYOwel585SOUAtVc4XkWhhJl4qldwX6oOhOH7L-eJ4",
      offerUrl: "https://www.tarif-butler.de/tarif",
      auftragUrl: "https://www.tarif-butler.de/auftrag",
      startUrl: "https://www.tarif-butler.de/start",
      offerProxyPath: "https://oynhnhkldvpoqhsfirwf.supabase.co/functions/v1/offer-proxy",
      offerEngineUrl: "https://oynhnhkldvpoqhsfirwf.supabase.co/storage/v1/object/public/engine-assets/tarif-engine.js"
    };

    const params = new URLSearchParams(window.location.search);
    const uuid = params.get("uuid");
    const lang = params.get("lang") || params.get("language") || "de";
    const postHeight = () => window.parent.postMessage({ type: "tarifbutler:height", height: document.documentElement.scrollHeight }, "*");
    new ResizeObserver(postHeight).observe(document.body);
    window.addEventListener("load", postHeight);

    function navigateTo(pathOrUrl) {
      const target = new URL(pathOrUrl, window.location.origin);
      const localPath = `${target.pathname}${target.search}${target.hash}`;
      if (window.parent !== window) {
        window.parent.postMessage({ type: "tarifbutler:navigate", url: localPath }, "*");
      } else if (target.origin === window.location.origin) {
        window.location.assign(localPath);
      } else {
        window.location.assign(target.toString());
      }
    }

    window.TARIFBUTLER_NAVIGATE = navigateTo;
    window.navigateToAuftrag = (nextUuid = uuid, nextLang = lang) => navigateTo(`/auftrag?uuid=${encodeURIComponent(nextUuid)}&lang=${encodeURIComponent(nextLang)}`);
    window.navigateToStart = (nextLang = lang) => navigateTo(`/start?lang=${encodeURIComponent(nextLang)}`);

    function applyDesign(data) {
      const brand = data?.design_config?.brand || {};
      const offer = data?.design_config?.offer || data?.design_config?.tarif || {};
      const legacy = data?.tarif_design || data?.offer_design || data?.setting_survey_design || {};
      const root = document.documentElement;
      root.style.setProperty("--primary-color", offer.primary_color || brand.primary_color || legacy.primary_color || "#00ff9d");
      root.style.setProperty("--bg-card", offer.bg_card || legacy.bg_card || "#ffffff");
      root.style.setProperty("--text-color", offer.text_color || brand.text_color || legacy.text_color || "#0f172a");
      root.style.setProperty("--border-radius", offer.border_radius || legacy.border_radius || "2rem");
    }

    function buildOfferConfig(data) {
      const runtime = data?.runtime_config || {};
      const urls = data?.url_config || {};
      return {
        ...BOOTSTRAP_CONFIG,
        uuid,
        orderUuid: uuid,
        auftragUuid: uuid,
        lang,
        language: lang,
        locationId: BOOTSTRAP_CONFIG.locationId,
        avatarUrl: urls.avatarUrl || urls.avatar_url || BOOTSTRAP_CONFIG.avatarUrl,
        offerUrl: urls.offerUrl || urls.offer_url || BOOTSTRAP_CONFIG.offerUrl,
        auftragUrl: urls.auftragUrl || urls.auftrag_url || BOOTSTRAP_CONFIG.auftragUrl,
        startUrl: urls.startUrl || urls.start_url || BOOTSTRAP_CONFIG.startUrl,
        offerProxyPath: runtime.offerProxyPath || runtime.offer_proxy_path || runtime.tarifProxyPath || runtime.tarif_proxy_path || BOOTSTRAP_CONFIG.offerProxyPath,
        offerEngineUrl: runtime.offerEngineUrl || runtime.offer_engine_url || runtime.tarifEngineUrl || runtime.tarif_engine_url || BOOTSTRAP_CONFIG.offerEngineUrl
      };
    }

    (async () => {
      try {
        if (!uuid) throw new Error("UUID fehlt");
        const client = supabase.createClient(BOOTSTRAP_CONFIG.supabaseUrl, BOOTSTRAP_CONFIG.supabaseKey);
        const { data, error } = await client.from("kunden_config").select("*").eq("location_id", BOOTSTRAP_CONFIG.locationId).single();
        if (error) throw error;
        window.KUNDEN_DATA = data;
        applyDesign(data);
        window.OFFER_CONFIG = buildOfferConfig(data);
        window.TARIF_CONFIG = window.OFFER_CONFIG;
        window.SURVEY_CONFIG = window.OFFER_CONFIG;
        const response = await fetch(`${window.OFFER_CONFIG.offerEngineUrl}?v=${Date.now()}`);
        if (!response.ok) throw new Error(`Angebots-Engine konnte nicht geladen werden: ${response.status}`);
        const script = document.createElement("script");
        script.text = await response.text();
        document.body.appendChild(script);
        postHeight();
      } catch (error) {
        console.error("Offer loader error:", error);
        document.getElementById("tarif-app").innerHTML = '<div class="loader-state loader-error"><h1>Angebot konnte nicht geladen werden.</h1><p>Bitte starten Sie die Anfrage erneut.</p></div>';
        postHeight();
      }
    })();
  </script>
</body>
</html>
