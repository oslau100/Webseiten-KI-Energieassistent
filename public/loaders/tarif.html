<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TarifButler Tarifangebot</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');
    :root{--primary:#00ff9d;--ink:#0f172a;--muted:#64748b;--card:#fff;--soft:#f8fafc;--line:#e2e8f0;--radius:2rem}*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Poppins,system-ui,sans-serif;color:var(--ink)}button{font:inherit}.tb-offer{max-width:1040px;margin:0 auto;padding:16px}.hero,.card,.cta{background:var(--card);border:1px solid #eef2f7;border-radius:var(--radius);box-shadow:0 24px 80px rgba(15,23,42,.08)}.hero{padding:34px;margin-bottom:18px}.eyebrow{margin:0 0 10px;color:#10b981;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.title{margin:0;font-size:clamp(2rem,5vw,3.8rem);line-height:1.02;font-weight:900;letter-spacing:-.05em}.lead{margin:14px 0 0;color:var(--muted);font-size:1.05rem}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.metric{background:var(--soft);border-radius:1.4rem;padding:20px}.metric strong{display:block;font-size:clamp(1.5rem,4vw,2.6rem);line-height:1;font-weight:900}.metric span{display:block;margin-top:8px;color:var(--muted);font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{padding:26px}.card h2{margin:0 0 16px;font-size:1.35rem}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row span{color:var(--muted)}.row strong{text-align:right}.summary{grid-column:1/-1}.summary p{margin:0;color:var(--muted);line-height:1.7}.cta{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:18px;padding:26px;background:#0f172a;color:white}.cta h2{margin:0 0 6px}.cta p{margin:0;color:#cbd5e1}.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:15px 22px;font-weight:900;cursor:pointer;text-decoration:none}.btn-primary{background:var(--primary);color:#0f172a}.btn-secondary{background:white;color:#0f172a}.loader-state{max-width:760px;margin:32px auto;padding:32px;border-radius:var(--radius);background:var(--card);box-shadow:0 24px 80px rgba(15,23,42,.08);text-align:center}.loader-state p{color:var(--muted)}.error{color:#ef4444}@media(max-width:760px){.metrics,.grid{grid-template-columns:1fr}.hero,.card,.cta{border-radius:1.4rem;padding:22px}.cta{align-items:stretch;flex-direction:column}.actions{flex-direction:column}.btn{width:100%}}
  </style>
</head>
<body>
  <main id="tarif-app" class="tb-offer"><div class="loader-state"><h1>Ihr Tarifangebot wird geladen…</h1><p>Bitte einen Moment Geduld.</p></div></main>
  <script>
    window.TB_BOOTSTRAP = {
      locationId: "zMzYbmm0fF0pPpuzSBL7",
      avatarUrl: "https://oynhnhkldvpoqhsfirwf.supabase.co/storage/v1/object/public/TarifButler%20Specifics/setting-survey-avatar.png",
      supabaseUrl: "https://oynhnhkldvpoqhsfirwf.supabase.co",
      supabaseKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95bmhuaGtsZHZwb3Foc2ZpcndmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTAwODksImV4cCI6MjA3NTA2NjA4OX0.9zYOwel585SOUAtVc4XkWhhJl4qldwX6oOhOH7L-eJ4",
      offerUrl: "https://www.tarif-butler.de/tarif",
      auftragUrl: "https://www.tarif-butler.de/auftrag",
      startUrl: "https://www.tarif-butler.de/start",
      settingProxyPath: "https://oynhnhkldvpoqhsfirwf.supabase.co/functions/v1/setting-proxy",
      closingProxyPath: "https://oynhnhkldvpoqhsfirwf.supabase.co/functions/v1/closing-proxy",
      settingEngineUrl: "https://oynhnhkldvpoqhsfirwf.supabase.co/storage/v1/object/public/engine-assets/setting-survey-engine.js",
      closingEngineUrl: "https://oynhnhkldvpoqhsfirwf.supabase.co/storage/v1/object/public/engine-assets/closing-survey-engine.js"
    };

    const params = new URLSearchParams(window.location.search);
    const uuid = params.get("uuid");
    const lang = params.get("lang") || params.get("language") || "de";
    const app = document.getElementById("tarif-app");
    const postHeight = () => window.parent.postMessage({ type: "tarifbutler:height", height: document.documentElement.scrollHeight }, "*");
    new ResizeObserver(postHeight).observe(document.body);
    window.addEventListener("load", postHeight);

    function navigate(pathOrUrl) {
      const target = new URL(pathOrUrl, window.location.origin);
      const sameOriginPath = `${target.pathname}${target.search}${target.hash}`;
      if (window.parent !== window) {
        window.parent.postMessage({ type: "tarifbutler:navigate", url: sameOriginPath }, "*");
      } else if (target.origin === window.location.origin) {
        window.location.assign(sameOriginPath);
      } else {
        window.location.assign(target.toString());
      }
    }

    const money = (value) => Number.isFinite(Number(value)) ? new Intl.NumberFormat(lang === "de" ? "de-DE" : undefined, { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(Number(value)) : "—";
    const clean = (value, fallback = "—") => value === undefined || value === null || value === "" ? fallback : String(value);
    const pick = (source, keys) => keys.reduce((found, key) => found ?? source?.[key], undefined);
    const escapeHtml = (value) => clean(value, "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));

    function normalizeOrder(order) {
      const recommended = order?.empfohlener_tarif || order?.recommended_tariff || order?.angebot || order?.offer || order?.tarif || order?.selected_tariff || {};
      const current = order?.aktueller_tarif || order?.current_tariff || order?.currentTariff || order?.current || {};
      return {
        recommended,
        current,
        aiSummary: pick(order, ["ai_summary", "aiSummary", "zusammenfassung", "summary"]),
        provider: pick(recommended, ["anbieter", "provider", "supplier", "versorger"]),
        tariffName: pick(recommended, ["tarif", "tarif_name", "tariff_name", "name", "productName"]),
        recommendedAnnual: pick(recommended, ["jahreskosten", "annual_cost", "annualCost", "cost_per_year", "newAnnualCost"]),
        recommendedMonthly: pick(recommended, ["monatskosten", "monthly_cost", "monthlyCost", "abschlag", "monthlyPayment"]),
        currentProvider: pick(current, ["anbieter", "provider", "supplier", "versorger"]),
        currentName: pick(current, ["tarif", "tarif_name", "tariff_name", "name", "productName"]),
        currentAnnual: pick(current, ["jahreskosten", "annual_cost", "annualCost", "cost_per_year"]) ?? pick(order, ["bisherige_jahreskosten", "currentAnnualCost"]),
        currentMonthly: pick(current, ["monatskosten", "monthly_cost", "monthlyCost", "abschlag"]) ?? pick(order, ["bisherige_monatskosten", "currentMonthlyCost"]),
        savings: pick(recommended, ["ersparnis", "savings", "annual_savings", "saving_per_year"]) ?? pick(order, ["ersparnis", "savings", "annual_savings", "saving_per_year"]),
        bonus: pick(recommended, ["bonus", "neukundenbonus", "cashback"]),
        priceGuarantee: pick(recommended, ["preisgarantie", "price_guarantee"]),
        term: pick(recommended, ["laufzeit", "contract_term", "term"]),
        notice: pick(recommended, ["kuendigungsfrist", "notice_period"]),
        consumption: pick(order, ["verbrauch", "consumption", "annual_consumption"]),
        postcode: pick(order, ["plz", "postcode", "zip"])
      };
    }

    async function maybeSingle(client, table, column, value) {
      try {
        const { data } = await client.from(table).select("*").eq(column, value).maybeSingle();
        return data;
      } catch (_) {
        return null;
      }
    }

    async function loadOrder(client) {
      for (const table of ["auftraege", "orders", "kunden_anfragen", "setting_survey_orders", "requests"]) {
        const byUuid = await maybeSingle(client, table, "uuid", uuid);
        if (byUuid) return byUuid;
        const byId = await maybeSingle(client, table, "id", uuid);
        if (byId) return byId;
      }
      return null;
    }

    function applyDesign(config) {
      const brand = config?.design_config?.brand || {};
      const offer = config?.design_config?.offer || config?.design_config?.tarif || {};
      const legacy = config?.tarif_design || config?.offer_design || config?.setting_survey_design || {};
      document.documentElement.style.setProperty("--primary", offer.primary_color || brand.primary_color || legacy.primary_color || "#00ff9d");
      document.documentElement.style.setProperty("--ink", offer.text_color || brand.text_color || legacy.text_color || "#0f172a");
      document.documentElement.style.setProperty("--radius", offer.border_radius || legacy.border_radius || "2rem");
    }

    function render(order) {
      const data = normalizeOrder(order);
      const auftragPath = `/auftrag?uuid=${encodeURIComponent(uuid)}&lang=${encodeURIComponent(lang)}`;
      const startPath = `/start?uuid=${encodeURIComponent(uuid)}&lang=${encodeURIComponent(lang)}`;
      app.innerHTML = `
        <section class="hero">
          <p class="eyebrow">Tarifempfehlung</p>
          <h1 class="title">${escapeHtml(data.provider || "Empfohlener Tarif")}${data.tariffName ? ` – ${escapeHtml(data.tariffName)}` : ""}</h1>
          <p class="lead">${data.consumption ? `${escapeHtml(data.consumption)} kWh Jahresverbrauch` : "Ihr berechnetes Angebot"}${data.postcode ? ` für ${escapeHtml(data.postcode)}` : ""}</p>
          <div class="metrics"><div class="metric"><strong>${money(data.savings)}</strong><span>Ersparnis pro Jahr</span></div><div class="metric"><strong>${money(data.recommendedAnnual)}</strong><span>Neue Jahreskosten</span></div><div class="metric"><strong>${money(data.recommendedMonthly)}</strong><span>Neue Monatskosten</span></div></div>
        </section>
        <section class="grid">
          <article class="card"><h2>Aktueller Tarif</h2><div class="row"><span>Anbieter</span><strong>${escapeHtml(data.currentProvider)}</strong></div><div class="row"><span>Tarif</span><strong>${escapeHtml(data.currentName)}</strong></div><div class="row"><span>Jahreskosten</span><strong>${money(data.currentAnnual)}</strong></div><div class="row"><span>Monatskosten</span><strong>${money(data.currentMonthly)}</strong></div></article>
          <article class="card"><h2>Empfohlener Tarif</h2><div class="row"><span>Anbieter</span><strong>${escapeHtml(data.provider)}</strong></div><div class="row"><span>Tarif</span><strong>${escapeHtml(data.tariffName)}</strong></div><div class="row"><span>Jahreskosten</span><strong>${money(data.recommendedAnnual)}</strong></div><div class="row"><span>Monatskosten</span><strong>${money(data.recommendedMonthly)}</strong></div><div class="row"><span>Ersparnis</span><strong>${money(data.savings)}</strong></div></article>
          <article class="card"><h2>Tarifdetails</h2><div class="row"><span>Bonus</span><strong>${money(data.bonus)}</strong></div><div class="row"><span>Preisgarantie</span><strong>${escapeHtml(data.priceGuarantee)}</strong></div><div class="row"><span>Laufzeit</span><strong>${escapeHtml(data.term)}</strong></div><div class="row"><span>Kündigungsfrist</span><strong>${escapeHtml(data.notice)}</strong></div></article>
          ${data.aiSummary ? `<article class="card summary"><h2>AI-Zusammenfassung</h2><p>${escapeHtml(data.aiSummary)}</p></article>` : ""}
        </section>
        <section class="cta"><div><h2>Jetzt wechseln</h2><p>TarifButler begleitet den Wechselprozess für Sie.</p></div><div class="actions"><button class="btn btn-secondary" id="edit-btn">Angaben ändern</button><button class="btn btn-primary" id="switch-btn">Jetzt wechseln</button></div></section>`;
      document.getElementById("switch-btn").addEventListener("click", () => navigate(auftragPath));
      document.getElementById("edit-btn").addEventListener("click", () => navigate(startPath));
      postHeight();
    }

    (async () => {
      try {
        if (!uuid) throw new Error("UUID fehlt");
        window.TB_CONFIG = { ...window.TB_BOOTSTRAP, uuid, lang, language: lang };
        const client = supabase.createClient(window.TB_BOOTSTRAP.supabaseUrl, window.TB_BOOTSTRAP.supabaseKey);
        const [{ data: customerConfig, error }, order] = await Promise.all([
          client.from("kunden_config").select("*").eq("location_id", window.TB_BOOTSTRAP.locationId).single(),
          loadOrder(client)
        ]);
        if (error) throw error;
        if (!order) throw new Error("Auftrag nicht gefunden");
        window.KUNDEN_DATA = customerConfig;
        window.AUFTRAG_DATA = order;
        applyDesign(customerConfig);
        render(order);
      } catch (error) {
        console.error("Tarif loader error:", error);
        app.innerHTML = '<div class="loader-state error"><h1>Angebot konnte nicht geladen werden.</h1><p>Bitte starten Sie die Anfrage erneut.</p></div>';
        postHeight();
      }
    })();
  </script>
</body>
</html>
