<script>
(async function(){
  const bootstrap = (window.TB_BOOTSTRAP && typeof window.TB_BOOTSTRAP === 'object') ? window.TB_BOOTSTRAP : {};
  function applyDesignVars(d){
    d = d || {};
    const root = document.documentElement;
    if (d.primary_color) root.style.setProperty('--primary-color', d.primary_color);
    if (d.bg_card) root.style.setProperty('--bg-card', d.bg_card);
    if (d.text_color) root.style.setProperty('--text-color', d.text_color);
    if (d.text_color_strong) root.style.setProperty('--text-color-strong', d.text_color_strong);
    if (d.border_radius) root.style.setProperty('--border-radius', d.border_radius);
    if (d.start_button && typeof d.start_button === 'object') {
      if (d.start_button.bg_color) root.style.setProperty('--btn-bg', d.start_button.bg_color);
      if (d.start_button.text_color) root.style.setProperty('--btn-text', d.start_button.text_color);
    }
    if (d.submit_button && typeof d.submit_button === 'object') {
      if (d.submit_button.bg_color) root.style.setProperty('--submit-btn-bg', d.submit_button.bg_color);
      if (d.submit_button.text_color) root.style.setProperty('--submit-btn-text', d.submit_button.text_color);
    }
    if (d.choice_card && typeof d.choice_card === 'object' && d.choice_card.selected_border_color) root.style.setProperty('--choice-selected-border', d.choice_card.selected_border_color);
    if (d.card && typeof d.card === 'object') {
      if (d.card.padding_top) root.style.setProperty('--card-padding-top', d.card.padding_top);
      if (d.card.padding_x) root.style.setProperty('--card-padding-x', d.card.padding_x);
      if (d.card.padding_bottom) root.style.setProperty('--card-padding-bottom', d.card.padding_bottom);
      if (d.card.min_height) root.style.setProperty('--card-min-height', d.card.min_height);
      if (d.card.shadow) root.style.setProperty('--card-shadow', d.card.shadow);
    }
  }
  function showFatal(msg){
    const mount = document.getElementById('survey-app');
    mount.innerHTML = '<div class="error-card"><h2 class="error-title">Rechnung-Survey konnte nicht geladen werden</h2><p class="error-copy">'+String(msg || 'Bitte später erneut versuchen.')+'</p></div>';
  }
  try {
    const config = {
      locationId: String(bootstrap.locationId || '').trim(),
      supabaseUrl: String(bootstrap.supabaseUrl || '').trim(),
      supabaseKey: String(bootstrap.supabaseKey || '').trim(),
      rechnungProxyPath: String(bootstrap.rechnungProxyPath || '').trim(),
      rechnungEngineUrl: String(bootstrap.rechnungEngineUrl || '').trim(),
      rechnungSuccessUrl: String(bootstrap.rechnungSuccessUrl || '').trim(),
      rechnungErrorUrl: String(bootstrap.rechnungErrorUrl || '').trim(),
      privacyUrl: String(bootstrap.privacyUrl || '').trim()
    };
    if (!config.locationId || !config.supabaseUrl || !config.supabaseKey) throw new Error('Missing bootstrap values');
    const client = supabase.createClient(config.supabaseUrl, config.supabaseKey);
    const { data, error } = await client.from('kunden_config').select('*').eq('location_id', config.locationId).single();
    if (error) throw error;
    window.KUNDEN_DATA = data;
    const runtime = (data && typeof data.runtime_config === 'object' && data.runtime_config) ? data.runtime_config : {};
    const urls = (data && typeof data.url_config === 'object' && data.url_config) ? data.url_config : {};
    const designConfig = data.design_config || {};
    const legacyDesign = data.setting_survey_design || {};
    const brandDesign = designConfig.brand || {};
    const surveyDesign = designConfig.survey || {};
    const d = { ...legacyDesign, ...brandDesign, ...surveyDesign };
    applyDesignVars(d);

    window.SURVEY_CONFIG = {
      locationId: config.locationId,
      supabaseUrl: config.supabaseUrl,
      supabaseKey: config.supabaseKey,
      proxyPath: String(runtime.rechnung_proxy_path || config.rechnungProxyPath || ''),
      engineUrl: String(runtime.rechnung_engine_url || config.rechnungEngineUrl || ''),
      successUrl: String(urls.rechnung_success_url || config.rechnungSuccessUrl || ''),
      errorUrl: String(urls.rechnung_error_url || config.rechnungErrorUrl || ''),
      privacyUrl: String(urls.privacy_url || config.privacyUrl || '')
    };

    if (!window.SURVEY_CONFIG.engineUrl) throw new Error('Missing rechnung engine URL');
    const s = document.createElement('script');
    s.src = window.SURVEY_CONFIG.engineUrl + (window.SURVEY_CONFIG.engineUrl.includes('?') ? '&' : '?') + 'v=' + Date.now();
    s.async = true;
    s.onerror = function(){ showFatal('Engine aktuell nicht erreichbar. Bitte Seite neu laden oder später erneut versuchen.'); };
    document.body.appendChild(s);
  } catch (e) {
    showFatal('Fehler beim Laden der Konfiguration. Bitte später erneut versuchen.');
  }
})();
</script>
